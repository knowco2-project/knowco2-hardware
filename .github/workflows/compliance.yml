name: Licensing compliance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-licensing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    runs-on:
      - codebuild-knowco2-hardware-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the dedicated CodeBuild runner
        env:
          EXECUTION_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$EXECUTION_ENVIRONMENT" = "self-hosted"
          case "${CODEBUILD_BUILD_ID:-}" in
            knowco2-hardware-ci:*) ;;
            *) echo "::error::This job requires the dedicated hardware CodeBuild project."; exit 1 ;;
          esac

      - name: Reject unreviewed fork execution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork CI is not enabled. A maintainer must review the exact changes and move approved code to a branch in this repository."
          exit 1

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install licensing tools without Docker
        run: |
          python -m venv "$RUNNER_TEMP/hardware-license-venv"
          "$RUNNER_TEMP/hardware-license-venv/bin/python" -m pip install --disable-pip-version-check 'reuse==6.2.0' 'PyYAML==6.0.2'

      - name: Check runner policy and its regression tests
        run: |
          "$RUNNER_TEMP/hardware-license-venv/bin/python" -m unittest discover -s ci -p 'test_*.py' -v
          "$RUNNER_TEMP/hardware-license-venv/bin/python" ci/check_workflows.py

      - name: Verify canonical hardware license copies
        run: cmp LICENSE LICENSES/CERN-OHL-S-2.0.txt

      - name: Verify REUSE compliance
        run: '"$RUNNER_TEMP/hardware-license-venv/bin/reuse" lint'
